<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta name="google-site-verification" content="tsesj2l0mZLtgdFcVbJxmWtbcasCMFwJb7hCF2_3HnE" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#07060d">
<meta name="description" content="Aether AI">
<link rel="icon" type="image/png" href="./AetherIcon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
/* Aether — flat monochrome interface. Every class the JS uses is kept. */
*{box-sizing:border-box}
:root{
  --bg:#0c0c0d; --surface:#131315; --surface-2:#19191c; --elev:#1c1c20;
  --border:#232327; --border-strong:#303036;
  --text:#f3f3f5; --muted:#a0a0a8; --faint:#6b6b74;
  --hover:#1d1d21;
  --accent:#f3f3f5; --on-accent:#0c0c0d;
  --focus:#8b7cf6;
  --green:#3ddc84; --red:#ff6b6b;
  --radius:14px; --sidebar-w:264px;
  --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
[data-theme="light"]{
  --bg:#f4f4f5; --surface:#ffffff; --surface-2:#eeeef0; --elev:#ffffff;
  --border:#e2e2e6; --border-strong:#d4d4da;
  --text:#111113; --muted:#5f5f68; --faint:#9a9aa3;
  --hover:#ececef; --accent:#111113; --on-accent:#ffffff; --green:#1fa35a;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.hidden{display:none!important}
kbd{font-family:inherit;font-size:11px;color:var(--faint);margin-left:auto}
svg{display:block}

.app{display:flex;width:100%;height:var(--app-h,100dvh)}

/* ---------- Sidebar ---------- */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100%;display:flex;flex-direction:column;gap:14px;padding:16px 14px;background:var(--surface);border-right:1px solid var(--border);transition:width .2s var(--ease),min-width .2s var(--ease),transform .24s var(--ease);z-index:30}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:28px;height:28px;object-fit:contain;transform-origin:50% 50%}
.brand-name{font-weight:650;font-size:17px;letter-spacing:-.3px}
body.is-generating .brand-logo{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted);font-size:15px;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn svg{width:17px;height:17px}
.new-chat{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;transition:opacity .15s}
.new-chat:hover{opacity:.88}
.new-chat kbd{color:inherit;opacity:.45}
.new-chat-icon{font-size:18px;line-height:1}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--border);border-radius:999px;color:var(--muted);background:var(--bg)}
.search:focus-within{border-color:var(--focus)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px}
.search input::placeholder{color:var(--faint)}
.conversation-area{flex:1;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px}
.section-title{display:flex;justify-content:space-between;padding:10px 10px 8px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.04em}
.conversation-list{display:flex;flex-direction:column;gap:2px}
.conversation-item{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.conversation-item:hover{background:var(--hover);color:var(--text)}
.conversation-item.active{background:var(--hover);color:var(--text)}
.conv-main{min-width:0;flex:1}
.conv-title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13.5px}
.conv-time{margin-top:2px;font-size:11px;color:var(--faint)}
.conv-delete{display:none;width:24px;height:24px;border-radius:7px;color:var(--muted);align-items:center;justify-content:center}
.conversation-item:hover .conv-delete{display:flex}
.conv-delete:hover{color:var(--red)}
.empty-conversations{padding:30px 10px;text-align:center;color:var(--faint);font-size:12px}
.sidebar-foot{position:relative;border-top:1px solid var(--border);padding-top:12px}
.profile-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;text-align:left;transition:background .15s}
.profile-btn:hover{background:var(--hover)}
.user-avatar{width:32px;height:32px;min-width:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--text);color:var(--bg);font-weight:700;font-size:13px;text-transform:uppercase}
.profile-info{display:flex;flex-direction:column;min-width:0}
.profile-info strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.profile-info span{font-size:11.5px;color:var(--muted)}
.sidebar.collapsed{width:68px;min-width:68px}
.sidebar.collapsed .label,.sidebar.collapsed .label-block,.sidebar.collapsed .brand-name{display:none}
.sidebar.collapsed .new-chat{justify-content:center;padding:0}
.sidebar.collapsed .sidebar-head{flex-direction:column;gap:8px}
.sidebar.collapsed .conversation-area{visibility:hidden}

/* ---------- Popovers ---------- */
.popover{position:absolute;z-index:60;background:var(--elev);border:1px solid var(--border-strong);border-radius:14px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.profile-menu{left:0;right:0;bottom:calc(100% + 8px)}
.sidebar.collapsed .profile-menu{left:100%;right:auto;bottom:0;width:190px;margin-left:10px}
.profile-menu button{display:block;width:100%;padding:9px 11px;border-radius:9px;text-align:left;font-size:13px}
.profile-menu button:hover{background:var(--hover)}
.profile-menu hr{border:0;border-top:1px solid var(--border);margin:5px 0}

/* ---------- Main ---------- */
.main{position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{height:60px;min-height:60px;display:flex;align-items:center;gap:10px;padding:0 22px}
.mobile-only{display:none}
.top-title{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.top-title strong{font-size:14px;font-weight:600}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.status-pill.online .status-dot{background:var(--green)}
.status-pill.offline .status-dot{background:var(--red)}
.top-actions{display:flex;gap:4px}

.chat-shell{position:relative;flex:1;min-height:0}
.chat-area{height:100%;overflow-y:auto;padding:24px 22px 200px;scroll-behavior:smooth}
.welcome{width:min(720px,100%);margin:0 auto;padding-top:14vh;text-align:center}
.welcome>*{animation:rise .5s var(--ease) both}
.hero-logo{width:56px;height:56px;object-fit:contain;margin-bottom:22px}
.welcome h1{margin:0;font-size:clamp(30px,4.2vw,42px);letter-spacing:-1.2px;font-weight:650;min-height:1.25em;animation-delay:.05s}
.welcome p{color:var(--muted);max-width:480px;margin:12px auto 0;line-height:1.6;animation-delay:.1s}
.suggestions{display:none}
.suggestion{display:none}

.message-list{width:min(760px,100%);margin:0 auto}
.message{display:flex;gap:14px;padding:16px 0}
.avatar{width:30px;height:30px;min-width:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.avatar.user{background:var(--text);color:var(--bg)}
.avatar.aether{background:var(--surface-2);border:1px solid var(--border)}
.avatar.aether img{width:20px;height:20px;object-fit:contain}
.avatar.aether img.spinning{animation:spin 1.1s linear infinite}
.message-body{flex:1;min-width:0}
.message-header{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.message-name{font-size:13px;font-weight:600}
.message-time{font-size:11px;color:var(--faint)}
.message-content{line-height:1.7;overflow-wrap:anywhere;color:var(--text);font-size:15px}
.message-content p{margin:0 0 .75em}
.message-content h1,.message-content h2,.message-content h3{margin:1.1em 0 .4em;line-height:1.3}
.message-content h1{font-size:21px}.message-content h2{font-size:18px}.message-content h3{font-size:16px}
.message-content ul,.message-content ol{margin:.3em 0 .8em;padding-left:22px}
.message-content li{margin-bottom:5px}
.message.user .message-content{white-space:pre-wrap;display:inline-block;max-width:100%;padding:10px 16px;border-radius:20px;background:var(--surface-2);font-size:14.5px}
.message-content :not(pre)>code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:6px}
.message.error .message-content{color:var(--red)}
.message-actions{margin-top:6px;opacity:0;transition:opacity .2s}
.message:hover .message-actions{opacity:1}
.copy-message{padding:3px 9px;border-radius:7px;font-size:11.5px;color:var(--faint)}
.copy-message:hover{background:var(--hover);color:var(--text)}

.table-wrap{max-width:100%;margin:14px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.table-wrap table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.5}
.table-wrap th,.table-wrap td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border);min-width:96px}
.table-wrap th{background:var(--surface-2);font-weight:600;font-size:12px;white-space:nowrap}
.table-wrap tr:last-child td{border-bottom:0}
.table-wrap th[data-a="c"],.table-wrap td[data-a="c"]{text-align:center}
.table-wrap th[data-a="r"],.table-wrap td[data-a="r"]{text-align:right}
.message-content hr{border:0;border-top:1px solid var(--border);margin:1.2em 0}
.message-content blockquote{margin:.7em 0;padding:2px 0 2px 14px;border-left:2px solid var(--border-strong);color:var(--muted)}
.message-content a{color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}

.sources{margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--border)}
.sources-title{font-size:11px;font-weight:600;color:var(--faint);margin-bottom:9px}
.source-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.message-content a.source-card,.source-card{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);text-decoration:none;transition:border-color .15s,background .15s;min-width:0}
.message-content a.source-card:hover{border-color:var(--border-strong);background:var(--surface-2)}
.src-num{flex:0 0 auto;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--mono);background:var(--text);color:var(--bg);margin-top:1px}
.src-body{display:flex;flex-direction:column;min-width:0;gap:2px}
.src-title{font-size:13px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.src-meta{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-path{color:var(--faint)}

.math-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.message-content .katex{font-size:1.08em}
.message-content .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;padding:4px 0}

.thinking-row{display:flex;align-items:center;gap:14px;padding:16px 0;animation:rise .3s var(--ease) both}
.thinking-label{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.thinking-dots{display:inline-flex;gap:4px}
.thinking-dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:pulse 1.2s ease-in-out infinite}
.thinking-dots i:nth-child(2){animation-delay:.15s}
.thinking-dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
.thinking-text{color:var(--muted)}
.thinking-text.swap{animation:stageIn .3s ease both}
@keyframes stageIn{from{opacity:0}to{opacity:1}}
.cursor{display:inline-block;width:7px;height:1em;margin-left:2px;vertical-align:text-bottom;background:var(--text);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.code-block-container{margin:14px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.code-block-header{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border)}
.code-block-lang{font-size:11px;font-weight:600;color:var(--muted)}
.code-block-copy-btn{padding:3px 9px;border-radius:7px;font-size:11.5px;color:var(--faint)}
.code-block-copy-btn:hover{background:var(--hover);color:var(--text)}
.code-block-copy-btn.copied{color:var(--green)}
.code-block-container pre{margin:0;padding:15px;overflow-x:auto}
.code-block-container code{font-family:var(--mono);font-size:13px;line-height:1.6;background:none;border:0;padding:0}
.message-content pre{max-width:100%}

.scroll-bottom{position:absolute;right:24px;bottom:180px;width:34px;height:34px;display:none;align-items:center;justify-content:center;border:1px solid var(--border-strong);border-radius:50%;background:var(--elev);color:var(--muted)}
.scroll-bottom.visible{display:flex}

/* ---------- Composer ---------- */
.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:12px 22px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%);z-index:5}
.composer{width:min(760px,100%);margin:0 auto;padding:14px 14px 12px 20px;border:1px solid var(--border-strong);border-radius:28px;background:var(--surface);transition:border-color .15s}
.composer:focus-within{border-color:var(--focus)}
.composer.drop{border-color:var(--focus)}
#messageInput{display:block;width:100%;max-height:190px;resize:none;border:0;outline:0;background:none;padding:6px 0 10px;line-height:1.55;font-size:15px}
#messageInput::placeholder{color:var(--faint)}
.attach-strip{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}
.attach-thumb{position:relative;width:60px;height:60px;border-radius:12px;overflow:hidden;border:1px solid var(--border-strong)}
.attach-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.attach-remove{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:12px;line-height:18px;text-align:center}
.file-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 11px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-2);font-size:12px;max-width:260px}
.file-chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.file-chip-remove{width:20px;height:20px;min-width:20px;border-radius:50%;color:var(--muted);font-size:14px;line-height:20px;text-align:center}
.file-chip-remove:hover{background:var(--hover);color:var(--text)}
.composer-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.composer-left{display:flex;align-items:center;gap:6px;min-width:0}
.model-picker{position:relative}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted);transition:background .15s,color .15s;white-space:nowrap}
.chip:hover{background:var(--hover);color:var(--text)}
.chip-dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip-dot.online{background:var(--green)}
.chip-dot.offline{background:var(--red)}
.chip-caret{font-size:10px;opacity:.6;transition:transform .2s var(--ease)}
.chip[aria-expanded="true"] .chip-caret{transform:rotate(180deg)}
.chip.toggle[aria-pressed="true"]{background:var(--hover);color:var(--text)}
.chip.toggle span{font-family:var(--mono);font-size:11px}
.chip.attach{width:32px;padding:0;justify-content:center}
.chip.attach svg{width:16px;height:16px}
.send-button{width:36px;height:36px;min-width:36px;border-radius:50%;background:var(--text);color:var(--bg);font-size:17px;font-weight:700;transition:opacity .15s}
.send-button:disabled{opacity:.2;cursor:default}
.send-button.stop{background:var(--text);color:var(--bg);font-size:12px}
.composer-footer{width:min(760px,100%);display:flex;justify-content:space-between;gap:12px;margin:9px auto 0;padding:0 10px;color:var(--faint);font-size:11px}

.model-menu{left:0;bottom:calc(100% + 8px);width:230px;max-height:none;overflow:visible}
.model-option{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:9px;text-align:left}
.model-option:hover{background:var(--hover)}
.model-option.locked{opacity:.5}
.model-option .mo-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.model-option strong{font-size:13px}
.model-option .mo-desc{font-size:11.5px;color:var(--muted);line-height:1.4}
.model-option .mo-check{color:var(--text);opacity:0}
.model-option.active .mo-check{opacity:1}

/* ---------- Modal / settings ---------- */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.modal-card{position:relative;width:min(500px,100%);max-height:86vh;overflow-y:auto;padding:26px;border:1px solid var(--border-strong);border-radius:20px;background:var(--surface);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal-close{position:absolute;top:14px;right:14px;font-size:20px}
.modal-card h2{margin:0 0 6px;font-size:19px;letter-spacing:-.2px}
.modal-card p{color:var(--muted);font-size:13.5px;line-height:1.65;margin:8px 0}
.tabs{display:flex;gap:4px;margin:16px 0 4px;padding:4px;border-radius:999px;background:var(--surface-2);width:max-content;max-width:100%}
.tab{padding:7px 14px;font-size:13px;color:var(--muted);border-radius:999px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--elev);color:var(--text)}
#settingsBody{animation:fadein .2s ease}
.setting{margin-top:20px}
.setting>label,.setting>.lbl{display:block;font-size:12px;font-weight:600;margin-bottom:9px;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border:1px solid var(--border);border-radius:999px;background:var(--surface-2)}
.seg button{padding:7px 16px;font-size:13px;color:var(--muted);border-radius:999px}
.seg button.active{background:var(--elev);color:var(--text)}
.swatches{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--border-strong);outline-offset:2px}
.swatch.active{outline:2px solid var(--text);outline-offset:2px}
input[type=color]{width:36px;height:28px;padding:0;border:1px solid var(--border-strong);border-radius:8px;background:none}
.form-field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.form-field label{font-size:12px;color:var(--muted)}
.form-field input{height:42px;padding:0 13px;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg);outline:0}
.form-field input:focus{border-color:var(--focus)}
.honeypot-field{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.btn{height:40px;padding:0 18px;border-radius:999px;font-weight:600;font-size:13.5px;background:var(--text);color:var(--bg);transition:opacity .15s}
.btn:hover:not(:disabled){opacity:.9}
.btn.ghost{background:none;border:1px solid var(--border-strong);color:var(--text)}
.btn.ghost:hover:not(:disabled){background:var(--hover);opacity:1}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%;margin-top:18px;height:44px}
.form-error{margin-top:12px;font-size:12px;color:var(--red);display:none}
.form-error.visible{display:block}
.form-switch{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
.form-switch a{color:var(--text);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.memory-box{margin-top:14px;padding:15px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow-y:auto}
.memory-box.error{color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv span:first-child{color:var(--muted)}

.toast-container{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 15px;border-radius:12px;background:var(--text);color:var(--bg);font-size:12.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:opacity .25s ease,transform .25s ease}
.toast.leaving{opacity:0;transform:translateY(6px)}

.msg-files{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.msg-files span{display:inline-flex;align-items:center;max-width:260px;padding:5px 11px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-images{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.msg-images img{max-width:230px;max-height:180px;border-radius:14px;border:1px solid var(--border);object-fit:cover}
.file-card{display:flex;align-items:center;gap:13px;margin:12px 0;padding:13px 15px;max-width:520px;border:1px solid var(--border-strong);border-radius:14px;background:var(--surface)}
.file-ic{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--surface-2);color:var(--text);font-family:var(--mono);font-size:13px;font-weight:700}
.file-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.file-meta strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta:hover strong{text-decoration:underline}
.file-dl{height:32px;padding:0 13px;font-size:12px}
.file-panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:110;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border-strong);transform:translateX(105%);transition:transform .24s var(--ease)}
.file-panel.open{transform:none}
.file-panel-head{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--border)}
.file-panel-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
.file-panel-head .btn{height:32px;font-size:12px}
.file-panel-body{flex:1;margin:0;padding:15px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre;color:var(--text)}
.scrim{display:none}

/* ---------- Motion (kept subtle) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.message.enter{animation:rise .3s var(--ease) both}
.message-list.fade{animation:fadein .25s ease}
.conversation-item.enter{animation:rise .25s var(--ease) both}
.modal:not(.hidden) .modal-backdrop{animation:fadein .15s ease}
.modal:not(.hidden) .modal-card{animation:rise .2s var(--ease)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.composer :focus-visible,.search input:focus-visible,#messageInput:focus-visible{outline:none}
button{-webkit-tap-highlight-color:transparent}
::selection{background:color-mix(in srgb,var(--text) 22%,transparent)}
.chat-area::-webkit-scrollbar,.conversation-area::-webkit-scrollbar{width:8px}
.chat-area::-webkit-scrollbar-thumb,.conversation-area::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}

.daily-btn{display:none!important}
.chat-daily{display:none!important}

/* =====================================================================
   Landing — flat, scroll-revealed
   ===================================================================== */
.landing{position:fixed;inset:0;z-index:90;overflow-y:auto;overflow-x:hidden;background:var(--bg);animation:fadein .3s ease;transition:opacity .3s ease;scroll-behavior:smooth}
.landing.leaving{opacity:0;pointer-events:none}
.ld-aurora,.ld-grid-bg{display:none}
.ld-progress{position:sticky;top:0;height:2px;z-index:20}
.ld-progress i{display:block;height:100%;width:0;background:var(--text)}
.ld-wrap{position:relative;z-index:1;width:min(1040px,100%);margin:0 auto;padding:0 24px 56px}
.ld-nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.ld-nav-right{display:flex;gap:6px;align-items:center}
.ld-link{padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:500;font-size:13.5px;transition:color .15s}
.ld-link:hover{color:var(--text)}
.ld-nav .btn{height:38px}

.ld-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;margin-top:clamp(20px,6vh,60px)}
.ld-hero-copy{text-align:left}
.ld-edition{display:flex;margin-bottom:24px}
.ld-edition .seg button{padding:7px 16px;font-weight:500}
.ld-edition .seg button.active{background:var(--text);color:var(--bg)}
.ld-kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.ld-kicker i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.ld-hero h1{margin:16px 0 0;font-size:clamp(38px,5.4vw,62px);line-height:1.04;letter-spacing:-2.2px;font-weight:650}
.ld-hero h1 em{font-style:normal;color:var(--muted)}
[data-edition="coder"] .ld-hero h1{font-family:var(--mono);letter-spacing:-2.4px;font-weight:600}
.ld-hero p{margin:18px 0 0;max-width:500px;font-size:clamp(15px,1.8vw,17px);line-height:1.65;color:var(--muted)}
.ld-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.ld-cta .btn{height:48px;padding:0 26px;font-size:14.5px}
.ld-note{margin-top:14px;font-size:12px;color:var(--faint)}

.ld-demo{position:relative}
.ld-orb{display:none}
.ld-demo-win{border:1px solid var(--border-strong);border-radius:24px;padding:16px;background:var(--surface)}
.ld-demo-top{display:flex;align-items:center;gap:6px;padding:2px 4px 14px;color:var(--muted);font-size:12px;font-weight:500}
.ld-demo-top span{width:9px;height:9px;border-radius:50%;background:var(--border-strong)}
.ld-demo-top b{margin-left:auto;font-weight:500;color:var(--faint);font-size:11px}
.ld-demo-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.ld-demo-chips span{padding:5px 11px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--muted)}
.ld-demo-chips span.on{color:var(--text);border-color:var(--border-strong);background:var(--hover)}
.ld-demo-input{display:flex;align-items:center;gap:10px;min-height:72px;padding:14px 16px;border-radius:20px;background:var(--bg);border:1px solid var(--border)}
.ld-demo-input p{margin:0;flex:1;font-size:14.5px;color:var(--text);max-width:none;line-height:1.5;text-align:left}
.ld-caret{display:inline-block;width:2px;height:1.1em;margin-left:2px;background:var(--text);vertical-align:-3px;animation:blink 1s steps(2) infinite}
.ld-send{width:34px;height:34px;min-width:34px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700}

.ld-sec{margin-top:clamp(72px,14vh,120px)}
.ld-eyebrow{display:inline-block;font-size:12px;font-weight:600;color:var(--muted)}
.ld-sec-head h2{margin:10px 0 0;font-size:clamp(28px,3.8vw,44px);letter-spacing:-1.2px;line-height:1.1;font-weight:650;max-width:680px}
.ld-sec-head p{margin:14px 0 0;max-width:540px;color:var(--muted);font-size:15px;line-height:1.65}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}

.ld-pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:36px;border-top:1px solid var(--border)}
.ld-pillar{position:relative;padding:26px 26px 30px 0;border-bottom:1px solid var(--border)}
.ld-pillar+.ld-pillar{padding-left:26px;border-left:1px solid var(--border)}
.ld-pillar .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--surface-2);color:var(--text);font-weight:600;font-family:var(--mono);font-size:14px;border:1px solid var(--border)}
.ld-pillar .num{position:absolute;right:26px;top:26px;font-family:var(--mono);font-size:12px;color:var(--faint)}
.ld-pillar strong{display:block;font-size:17px;margin:20px 0 8px;letter-spacing:-.2px;font-weight:600}
.ld-pillar span{display:block;font-size:13.5px;color:var(--muted);line-height:1.65}

.ld-feats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:34px}
.ld-feat{display:grid;grid-template-columns:auto 1fr;gap:0 16px;align-items:start;padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--surface)}
.ld-feat:first-child{grid-column:span 2}
.ld-feat .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--surface-2);color:var(--text);font-family:var(--mono);font-weight:600;font-size:14px;border:1px solid var(--border)}
.ld-feat .tag{display:inline-block;margin-bottom:8px;font-size:12px;color:var(--faint)}
.ld-feat strong{display:block;font-size:16.5px;letter-spacing:-.2px;margin-bottom:6px;font-weight:600}
.ld-feat span.d{display:block;font-size:13.5px;color:var(--muted);line-height:1.6}

.ld-daily-sec{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
.ld-daily-sec h2{margin:10px 0 0;font-size:clamp(26px,3.4vw,38px);letter-spacing:-1.1px;line-height:1.1;font-weight:650}
.ld-daily-sec .ld-sec-p{margin:14px 0 0;color:var(--muted);line-height:1.65;max-width:460px}
.ld-cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.ld-cats span{padding:7px 13px;border-radius:999px;border:1px solid var(--border-strong);font-size:12.5px;color:var(--muted)}
.ld-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.ld-stats div{padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--surface)}
.ld-stats b{display:block;font-size:20px;letter-spacing:-.4px;font-weight:650}
.ld-stats span{font-size:12px;color:var(--muted);line-height:1.5}
.ld-challenges{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--border)}
.ld-ch{padding:18px 4px;border-bottom:1px solid var(--border)}
.ld-ch small{display:block;font-size:12px;color:var(--faint)}
.ld-ch strong{display:block;margin-top:5px;font-size:16px;letter-spacing:-.2px;font-weight:600}
.ld-ch span{display:block;margin-top:5px;font-size:13px;color:var(--muted);line-height:1.6}

.ld-final{margin-top:clamp(80px,16vh,130px);padding:clamp(34px,6vw,60px) 0;text-align:left;border-top:1px solid var(--border)}
.ld-final h2{margin:12px 0 0;font-size:clamp(30px,4.4vw,50px);letter-spacing:-1.5px;line-height:1.05;font-weight:650}
.ld-final p{margin:14px 0 0;max-width:480px;color:var(--muted);line-height:1.65}
.ld-final .ld-cta{margin-top:26px}
.ld-foot{margin-top:40px;text-align:center;font-size:11.5px;color:var(--faint)}

@media(max-width:900px){
  .ld-hero{grid-template-columns:1fr;gap:34px}
  .ld-daily-sec{grid-template-columns:1fr}
  .ld-pillars{grid-template-columns:1fr}
  .ld-pillar+.ld-pillar{padding-left:0;border-left:0}
}
@media(max-width:800px){
  .sidebar,.sidebar.collapsed{position:fixed;left:0;top:0;bottom:0;width:284px;min-width:284px;transform:translateX(-105%);box-shadow:20px 0 50px rgba(0,0,0,.4)}
  .sidebar.collapsed .label,.sidebar.collapsed .label-block,.sidebar.collapsed .brand-name{display:revert}
  .sidebar.collapsed .conversation-area{visibility:visible}
  .sidebar.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
  .mobile-only{display:inline-flex}
  .topbar{padding:0 12px}
  .chat-area{padding:20px 14px 190px}
  .composer-wrap{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .hide-mobile{display:none}
  .message{gap:11px}
  .model-menu{position:fixed;left:12px;right:12px;bottom:96px;width:auto}
  .table-wrap table{font-size:12px}
  .table-wrap th,.table-wrap td{padding:7px 10px;min-width:84px}
  .ld-wrap{padding:0 18px 48px}
  .ld-nav .ld-link.hide-sm{display:none}
  .ld-feats{grid-template-columns:1fr}
  .ld-feat:first-child{grid-column:auto}
  .ld-stats{grid-template-columns:1fr}
  .ld-cta .btn{width:100%}
  .ld-hero h1{letter-spacing:-1.8px}
}

/* Collapsed sidebar: centre the account block on the same axis as the logo and new-chat button */
.sidebar.collapsed .sidebar-foot{padding-top:12px}
.sidebar.collapsed .profile-btn{justify-content:center;padding:6px 0;gap:0}
.sidebar.collapsed .user-avatar{margin:0 auto}
.sidebar.collapsed .sidebar-head{align-items:center;padding:0}

/* ---- Round 2 fixes ---- */
#topStatusPill,#modelDot,.model-option .chip-dot{display:none!important}
.top-text{display:flex;flex-direction:column;min-width:0;gap:2px}
.top-text strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.top-sub{font-size:11.5px;color:var(--muted)}
.model-picker .chip{border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);height:34px;padding:0 13px}
.model-picker .chip:hover{background:var(--hover)}

/* ---- Animations back, transform/opacity only, no blur or smooth-scroll stutter ---- */
.chat-area{scroll-behavior:auto}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.welcome>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.welcome>.hero-logo{animation:rise .6s cubic-bezier(.2,.7,.2,1) both,floaty 5s ease-in-out .6s infinite}
.welcome>h1{animation-delay:.08s}
.welcome>p{animation-delay:.16s}
.rot{display:inline-block;transition:opacity .45s ease,transform .45s ease}
.rot.out{opacity:0;transform:translateY(-10px)}
.rot.pre{opacity:0;transform:translateY(10px)}
.message.enter,.thinking-row{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
.conversation-item.enter{animation:rise .3s cubic-bezier(.2,.7,.2,1) both}
.toast{animation:rise .25s ease both}
.popover{animation:pop .16s cubic-bezier(.2,.7,.2,1);transform-origin:bottom left}
.modal:not(.hidden) .modal-backdrop{animation:fadein .2s ease}
.modal:not(.hidden) .modal-card{animation:pop .24s cubic-bezier(.2,.7,.2,1)}
.file-panel{transition:transform .24s cubic-bezier(.2,.7,.2,1)}
.send-button,.chip,.new-chat,.btn,.icon-btn,.conversation-item{transition:opacity .15s,background .15s,color .15s,transform .15s}
.send-button:active:not(:disabled),.new-chat:active,.chip:active,.icon-btn:active{transform:scale(.96)}
.landing .ld-hero-copy>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.landing .ld-hero-copy>:nth-child(2){animation-delay:.08s}
.landing .ld-hero-copy>:nth-child(3){animation-delay:.16s}
.landing .ld-hero-copy>:nth-child(4){animation-delay:.24s}
.landing .ld-hero-copy>:nth-child(5){animation-delay:.3s}
.ld-demo-win{animation:rise .8s .15s cubic-bezier(.2,.7,.2,1) both}
.landing .ld-link{transition:color .15s}
.reveal{transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}

#collapseButton svg{width:17px;height:17px}
#sendButton svg{display:block;margin:auto}
.chip-caret{display:none}
</style>
<title>Aether</title>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <img src="./AetherIcon.png" alt="" class="brand-logo">
        <span class="brand-name">Aether</span>
      </div>
      <button class="icon-btn" id="collapseButton" title="Collapse sidebar" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>

    <button class="new-chat" id="newChatButton">
      <span class="new-chat-icon">＋</span><span class="label">New chat</span><kbd class="label">N</kbd>
    </button>

    <div class="search label-block">
      <span>⌕</span>
      <input id="chatSearch" type="text" placeholder="Search chats" aria-label="Search chats">
    </div>

    <div class="conversation-area label-block">
      <div class="section-title"><span>Chats</span><span id="conversationCount">0</span></div>
      <div id="conversationList" class="conversation-list"></div>
      <div id="emptyConversations" class="empty-conversations">No conversations yet</div>
    </div>

    <div class="sidebar-foot">
      <button class="profile-btn" id="profileButton" aria-haspopup="true">
        <span class="user-avatar" id="profileAvatar">?</span>
        <span class="profile-info label">
          <strong id="profileName">Guest</strong>
          <span id="profileSub">Not signed in</span>
        </span>
      </button>
      <div class="popover profile-menu hidden" id="profileMenu">
        <button data-action="settings">Settings</button>
        <button data-action="modelinfo">Model info</button>
        <button data-action="policy">Policy</button>
        <hr>
        <button data-action="login" id="menuLogin">Log in</button>
        <button data-action="signup" id="menuSignup">Sign up</button>
        <button data-action="logout" id="menuLogout" class="hidden">Log out</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="mobileMenu" aria-label="Open menu">☰</button>
      <div class="top-title">
        <div class="top-text"><strong id="topModelName">New conversation</strong><span class="top-sub" id="topModelSub">Aether Everyday</span></div>
        <span class="status-pill" id="topStatusPill"><span class="status-dot"></span><span id="topStatusText">Checking…</span></span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="exportButton" title="Export conversation" aria-label="Export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg></button>
        <button class="icon-btn" id="clearButton" title="Clear conversation" aria-label="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>
      </div>
    </header>

    <section class="chat-shell">
      <div id="chatArea" class="chat-area" aria-live="polite"></div>
      <button class="scroll-bottom" id="scrollBottom" aria-label="Scroll to bottom">↓</button>
    </section>

    <footer class="composer-wrap">
      <div class="composer">
        <div class="attach-strip hidden" id="attachStrip"></div>
        <textarea id="messageInput" rows="1" placeholder="Message Aether..." aria-label="Message"></textarea>
        <div class="composer-toolbar">
          <div class="composer-left">
            <div class="model-picker">
              <button class="chip" id="modelButton" type="button" aria-haspopup="listbox">
                <span class="chip-dot" id="modelDot"></span>
                <span id="modelButtonName">Aether Everyday</span>
                
              </button>
              <div class="popover model-menu hidden" id="modelMenu" role="listbox"></div>
            </div>
            <button class="chip attach hidden" id="attachButton" type="button" title="Attach image" aria-label="Attach image">＋</button>
            <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple class="hidden">
            <button class="chip attach hidden" id="fileButton" type="button" title="Attach file" aria-label="Attach file"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
            <input type="file" id="fileInput" multiple class="hidden">
            <button class="chip toggle hidden" id="syntaxToggle" type="button" aria-pressed="false" title="Syntax Code mode">
              <span>{ }</span> Syntax Code

<script>
/* =====================================================================
   Aether frontend — vanilla JS
   Backend: Aether Server (FastAPI). Endpoints used: /health, /signup,
   /login, /logout, /chat/stream, /chat/cancel, /chat/status/{id},
   /conversations, /conversations/{id}, /agent/files/{id}/{path}.
   ===================================================================== */

const API_URL = "https://earthwarmer2000ultimate.tailfff298.ts.net";

/* ---- Easy-to-edit configuration ----------------------------------- */

// Model list. Filled at runtime from GET /health (id -> {name, desc,
// syntaxCode, vision, files}). When Syntax Code mode is on, "/code " is silently
// prefixed to the message sent to the server (see chatBody).
// Seeded with the default model so the UI can render before the first /health reply arrives.
const MODELS = { "aether-everyday": { name: "Aether Everyday", desc: "Checking…", syntaxCode: false, vision: false, files: false } };  // then filled from GET /health
const DEFAULT_MODEL = "aether-everyday";
const GUEST_ALLOWED_MODELS = ["aether-everyday"];   // keep in sync with the server
const GUEST_DEFAULT_MODEL = "aether-everyday";

// Reads the model catalog from the server and (re)builds MODELS.
async function loadModels() {
    try {
        const r = await fetch(API_URL + "/health", { cache: "no-store" });
        if (!r.ok) throw new Error("health " + r.status);
        const d = await r.json();
        for (const [id, m] of Object.entries(d.models || {})) {
            MODELS[id] = { name: m.name || id, desc: m.running ? "Online" : "Offline", syntaxCode: false, vision: false, files: !!m.files };
        }
    } catch {}
}

// Memory retrieval endpoint. The original files contain no memory API, so it
// is unset. Set to e.g. "/memory" once the real path is known; the request is
// sent as GET with the Bearer token.
const MEMORY_ENDPOINT = null;

const MAX_IMAGES = 4;            // keep in sync with the server
const IMAGE_MAX_SIDE = 1280;     // images are shrunk in the browser before upload
const MAX_FILES = 4;             // keep in sync with the server (MAX_FILES_PER_MESSAGE)
const MAX_FILE_BYTES = 8000000;  // keep in sync with the server (MAX_FILE_BYTES)
const HEALTH_POLL_MS = 10000;
const STATUS_POLL_MS = 400;      // how often the thinking indicator asks the server what it is doing
const ACCENTS = ["#7c5cff", "#c08bff", "#4f8cff", "#ff7ac8", "#42d97b", "#ffc247"];

/* ---- Storage keys (unchanged so existing data keeps working) ------- */
const STORAGE_KEY = "aether_conversations_v2";
const ACTIVE_KEY = "aether_active_conversation_v2";
const MODEL_KEY = "aether_selected_model_v1";
const THEME_KEY = "aether_theme_v1";
const ACCENT_KEY = "aether_accent_v2";   // v2: new violet default; older saved picks are ignored once
const SIDEBAR_KEY = "aether_sidebar_collapsed_v1";
const AUTH_KEY = "aether_auth_email_v1";
const TOKEN_KEY = "aether_auth_token_v1";
const SYNTAX_KEY = "aether_syntax_code_v1";

/* ---- DOM ---------------------------------------------------------- */
const $ = id => document.getElementById(id);
const chatArea = $("chatArea"), messageInput = $("messageInput"), sendButton = $("sendButton");
const sidebar = $("sidebar"), scrim = $("scrim"), modal = $("modal"), modalContent = $("modalContent");
const modelMenu = $("modelMenu"), modelButton = $("modelButton"), syntaxToggle = $("syntaxToggle");
const profileMenu = $("profileMenu");

/* ---- State -------------------------------------------------------- */
let modelStatus = null;           // null = not checked yet
let thinking = false;
let syncing = false;
let currentView = "chats";
let syntaxActive = localStorage.getItem(SYNTAX_KEY) === "1";
let pendingImages = [];          // data URLs waiting to be sent
let pendingFiles = [];           // { name, data (base64) } waiting to be sent
let conversations = [];
let activeAbort = null;        // AbortController for this tab's streaming request
let activeRequestId = null;    // the id the server knows that request by
const newRequestId = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let activeConversationId = localStorage.getItem(ACTIVE_KEY) || null;
let selectedModel = localStorage.getItem(MODEL_KEY) || DEFAULT_MODEL;

/* ===================================================================
   Markdown (math is pulled out first, then escaped, then formatted —
   never inserts raw HTML from the model)
   =================================================================== */
function inlineMd(s) {
    const codes = [];
    s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, "$1<em>$2</em>");
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[+i] + "</code>");
}

// Renders one extracted math segment with KaTeX. Falls back to escaped source
// text if KaTeX failed to load, so nothing is ever lost or executed.
function renderMath(m) {
    if (window.katex) {
        try {
            return m.display
                ? '<div class="math-display">' + katex.renderToString(m.tex, { displayMode: true, throwOnError: false }) + "</div>"
                : katex.renderToString(m.tex, { displayMode: false, throwOnError: false });
        } catch {}
    }
    const safe = m.tex.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return m.display ? '<div class="math-display"><code>' + safe + "</code></div>" : "<code>" + safe + "</code>";
}

/* ---- Sources: turn a search "Sources" list into tidy cards ---------
   Bing redirect links (bing.com/aclick?...&u=a1<base64 of the real URL>)
   are decoded to the real destination so the card shows the actual site. */
function decodeSourceUrl(u) {
    try {
        const x = new URL(u);
        if (/(^|\.)bing\.com$/i.test(x.hostname) && x.pathname.startsWith("/aclick")) {
            const p = x.searchParams.get("u");
            if (p) {
                let b = p.replace(/^a1/, "").replace(/-/g, "+").replace(/_/g, "/");
                while (b.length % 4) b += "=";
                const bytes = Uint8Array.from(atob(b), c => c.charCodeAt(0));
                const real = new TextDecoder().decode(bytes);
                if (/^https?:\/\//i.test(real)) return real;
            }
        }
    } catch {}
    return u;
}

function sourceCard(item, i) {
    const raw = item.replace(/&amp;/g, "&");               // URLs were HTML-escaped earlier
    const um = raw.match(/https?:\/\/[^\s)<>"]+/);
    const rawUrl = um ? um[0] : "";
    const href = rawUrl ? decodeSourceUrl(rawUrl) : "";
    const safeHref = /^https?:\/\//i.test(href) ? href : "";
    let host = "", path = "";
    try {
        const x = new URL(href);
        host = x.hostname.replace(/^www\./, "");
        const p = decodeURI(x.pathname).replace(/\/$/, "");
        path = p.length > 1 ? (p.length > 40 ? p.slice(0, 40) + "…" : p) : "";
    } catch {}
    // title = the text around the link, with the link and separators removed
    let title = raw.replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
                   .replace(rawUrl, "").replace(/\*\*/g, "")
                   .replace(/^[\s:\-—–|]+|[\s:\-—–|]+$/g, "").trim();
    if (!title) title = host || "Source";
    const attr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    const inner = '<span class="src-num">' + (i + 1) + '</span>' +
        '<span class="src-body"><span class="src-title">' + title + '</span>' +
        '<span class="src-meta">' + attr(host) + (path ? '<span class="src-path">' + attr(path) + '</span>' : '') + '</span></span>';
    return safeHref
        ? '<a class="source-card" href="' + attr(safeHref) + '" target="_blank" rel="noopener noreferrer">' + inner + '</a>'
        : '<div class="source-card">' + inner + '</div>';
}

// Conversation whose messages are being rendered (file downloads are scoped to it).
let parseSid = null;

// A file the code agent wrote: a card with a Download button (fetched with the login token).
function fileCard(rel) {
    const attr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    const name = rel.split("/").pop();
    return '<div class="file-card" data-session="' + attr(parseSid || activeConversationId || "") + '">' +
        '<span class="file-ic">▤</span>' +
        '<span class="file-meta" data-open="' + attr(rel) + '" title="Open file"><strong>' + attr(name) + '</strong><span>' + attr(rel) + '</span></span>' +
        '<button class="btn ghost file-dl" type="button" data-download="' + attr(rel) + '">Download</button></div>';
}

function parseMarkdown(text) {
    if (!text) return "";

    // 1) Pull math out BEFORE anything else touches the text.
    const mathStore = [];
    text = text.replace(
        /(```[\s\S]*?(?:```|\$))|(`[^`\n]+`)|\$\$([\s\(\S\)]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|(?<![\\\$\w])\$(?!\$)([^\(\n]*?[^\s\)][^\(\n]*?)\$(?![\w\)])/g,
        (m, code, icode, dd, bd, pi, inl) => {
            if (code || icode) return m;
            const display = dd !== undefined || bd !== undefined;
            const tex = dd ?? bd ?? pi ?? inl;
            mathStore.push({ tex: tex.trim(), display });
            return "\u0001" + (mathStore.length - 1) + "\u0001";
        }
    );

    // 2) Normal markdown, with HTML escaping.
    const lines = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").split("\n");
    const out = [];
    let inCode = false, code = [], lang = "code", list = null, para = [], tbl = [];
    let srcMode = false, srcItems = [];

    const flushPara = () => { if (para.length) { out.push("<p>" + inlineMd(para.join("<br>")) + "</p>"); para = []; } };
    const flushList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
    const splitRow = r => r.replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
    const isSep = r => /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?$/.test(r);
    const flushTable = () => {
        if (!tbl.length) return;
        if (tbl.length >= 2 && isSep(tbl[1])) {
            const head = splitRow(tbl[0]);
            const al = splitRow(tbl[1]).map(c => /^:-+:$/.test(c) ? "c" : /-+:$/.test(c) ? "r" : "l");
            const cell = (tag, c, i) => "<" + tag + ' data-a="' + (al[i] || "l") + '">' + inlineMd(c) + "</" + tag + ">";
            let h = '<div class="table-wrap"><table><thead><tr>' + head.map((c, i) => cell("th", c, i)).join("") + "</tr></thead><tbody>";
            for (const r of tbl.slice(2)) {
                const cells = splitRow(r);
                h += "<tr>" + head.map((_, i) => cell("td", cells[i] || "", i)).join("") + "</tr>";
            }
            out.push(h + "</tbody></table></div>");
        } else {
            tbl.forEach(r => para.push(r));
            flushPara();
        }
        tbl = [];
    };
    const flushSources = () => {
        if (!srcMode) return;
        srcMode = false;
        if (!srcItems.length) { out.push("<p><strong>Sources:</strong></p>"); return; }
        out.push('<div class="sources"><div class="sources-title">Sources</div><div class="source-list">' +
            srcItems.map((it, i) => sourceCard(it, i)).join("") + "</div></div>");
        srcItems = [];
    };

    const codeHtml = () =>
        '<div class="code-block-container"><div class="code-block-header"><span class="code-block-lang">' + lang +
        '</span><button class="code-block-copy-btn" data-copy-code>Copy</button></div><pre><code>' + code.join("\n") + "</code></pre></div>";

    for (const line of lines) {
        const t = line.trim();
        if (!inCode) {
            if (t.startsWith("|")) { flushPara(); flushList(); tbl.push(t); continue; }
            if (tbl.length) flushTable();
        }
        if (t.startsWith("```")) {
            if (!inCode) {
                flushPara(); flushList();
                inCode = true; code = [];
                lang = t.slice(3).trim().replace(/[^a-zA-Z0-9+#._-]/g, "").slice(0, 20) || "code";
            } else { inCode = false; out.push(codeHtml()); }
            continue;
        }
        if (inCode) { code.push(line); continue; }
        const fm = t.match(/^\[\[file:(.+)\]\]$/);
        if (fm) { flushPara(); flushList(); out.push(fileCard(fm[1])); continue; }

        // Sources block: collect the bullet items that follow a "Sources:" heading
        if (srcMode) {
            const li = t.match(/^[-*]\s+(.*)$/);
            if (li) { srcItems.push(li[1]); continue; }
            if (t === "") continue;
            flushSources();
        }
        if (/^\**\s*sources?\s*:?\s*\**$/i.test(t)) { flushPara(); flushList(); srcMode = true; srcItems = []; continue; }

        let m;
        if ((m = t.match(/^(#{1,3})\s+(.*)$/))) {
            flushPara(); flushList();
            out.push("<h" + m[1].length + ">" + inlineMd(m[2]) + "</h" + m[1].length + ">");
        } else if ((m = t.match(/^[-*]\s+(.*)$/))) {
            flushPara();
            if (list !== "ul") { flushList(); out.push("<ul>"); list = "ul"; }
            out.push("<li>" + inlineMd(m[1]) + "</li>");
        } else if ((m = t.match(/^\d+[.)]\s+(.*)$/))) {
            flushPara();
            if (list !== "ol") { flushList(); out.push("<ol>"); list = "ol"; }
            out.push("<li>" + inlineMd(m[1]) + "</li>");
        } else if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) {
            flushPara(); flushList(); out.push("<hr>");
        } else if ((m = t.match(/^&gt;\s?(.*)$/))) {
            flushPara(); flushList(); out.push("<blockquote>" + inlineMd(m[1]) + "</blockquote>");
        } else if (t === "") {
            flushPara(); flushList();
        } else {
            flushList(); para.push(t);
        }

    }
    flushTable(); flushSources(); flushPara(); flushList();
    if (inCode) out.push(codeHtml());

    // 3) Put the rendered math back in place.
    return out.join("").replace(/\u0001(\d+)\u0001/g, (_, i) => renderMath(mathStore[+i]));
}

/* ===================================================================
   Auth helpers
   =================================================================== */
const getToken = () => localStorage.getItem(TOKEN_KEY) || null;
const isLoggedIn = () => !!localStorage.getItem(AUTH_KEY) && !!getToken();

function authFetch(path, options) {
    const opts = Object.assign({}, options || {});
    opts.headers = Object.assign({}, opts.headers || {});
    const token = getToken();
    if (token) opts.headers["Authorization"] = "Bearer " + token;
    return fetch(API_URL + path, opts);
}

// Syntax Code mode: the server's existing /code command does the work, so we
// prefix the outgoing message with "/code ". The user never sees the prefix.
const SYNTAX_PREFIX = "/code ";
function chatBody(sessionId, message, model, guest, syntaxCode, images, requestId, files) {
    const outgoing = syntaxCode ? SYNTAX_PREFIX + message : message;
    const fileList = (files || []).map(f => ({ name: f.name, data: f.data }));
    return JSON.stringify({ session_id: sessionId, message: outgoing, model, guest, token: getToken(),
                            images: images || [], files: fileList, request_id: requestId || "" });
}
// Server-stored history contains the prefix; hide it when displaying.
const stripSyntaxPrefix = s => (typeof s === "string" && s.startsWith(SYNTAX_PREFIX)) ? s.slice(SYNTAX_PREFIX.length) : s;

/* ===================================================================
   Model selection (obsolete ids are never selectable or sent)
   =================================================================== */
function sanitizeModel(id) {
    if (!MODELS[id]) return isLoggedIn() ? DEFAULT_MODEL : GUEST_DEFAULT_MODEL;
    if (!isLoggedIn() && !GUEST_ALLOWED_MODELS.includes(id)) return GUEST_DEFAULT_MODEL;
    return id;
}

function renderModelMenu() {
    modelMenu.innerHTML = "";
    for (const id of Object.keys(MODELS)) {
        const m = MODELS[id];
        const locked = !isLoggedIn() && !GUEST_ALLOWED_MODELS.includes(id);
        const b = document.createElement("button");
        b.type = "button";
        b.className = "model-option" + (id === selectedModel ? " active" : "") + (locked ? " locked" : "");
        b.dataset.model = id;
        b.title = locked ? "Log in to use this model" : "";
        b.innerHTML = '<span class="chip-dot ' + dotClass(id) + '"></span><span class="mo-main"><strong></strong><span class="mo-desc"></span></span><span class="mo-check">✓</span>';
        b.querySelector("strong").textContent = m.name;
        b.querySelector(".mo-desc").textContent = m.desc + (locked ? " (log in)" : "");
        modelMenu.appendChild(b);
    }
}

function dotClass(id) {
    if (!modelStatus) return "";
    return modelStatus[id] && modelStatus[id].running ? "online" : "offline";
}

function updateModelUI() {
    const m = MODELS[selectedModel];
    $("modelButtonName").textContent = m.name;
    $("topModelSub").textContent = m.name;
    $("modelDot").className = "chip-dot " + dotClass(selectedModel);

    // Syntax Code: only for models flagged as supporting it
    const supported = !!m.syntaxCode;
    syntaxToggle.classList.toggle("hidden", !supported);
    const on = supported && syntaxActive;
    syntaxToggle.setAttribute("aria-pressed", on ? "true" : "false");

    const canImg = supportsImages(selectedModel);
    $("attachButton").classList.toggle("hidden", !canImg);
    if (!canImg && pendingImages.length) { pendingImages = []; renderAttachments(); }

    const canFile = supportsFiles(selectedModel);
    $("fileButton").classList.toggle("hidden", !canFile);
    if (!canFile && pendingFiles.length) { pendingFiles = []; renderAttachments(); }

    const pill = $("topStatusPill");
    pill.classList.toggle("online", !!modelStatus && dotClass(selectedModel) === "online");
    pill.classList.toggle("offline", !!modelStatus && dotClass(selectedModel) === "offline");
    $("topStatusText").textContent = !modelStatus ? "Checking…" : (dotClass(selectedModel) === "online" ? "Online" : "Offline");
    renderModelMenu();
}

function selectModel(id) {
    if (thinking || !MODELS[id]) return;
    if (!isLoggedIn() && !GUEST_ALLOWED_MODELS.includes(id)) {
        closePopovers();
        showToast("Log in to use this model");
        openAuthModal("login");
        return;
    }
    selectedModel = id;
    localStorage.setItem(MODEL_KEY, id);
    closePopovers();
    updateModelUI();
    updateComposer();
}

function isSyntaxOn() { return !!MODELS[selectedModel].syntaxCode && syntaxActive; }

/* ===================================================================
   Image attachments
   =================================================================== */
function supportsImages(id) {
    const m = MODELS[id];
    if (!m || !m.vision || !isLoggedIn()) return false;
    return !(modelStatus && modelStatus[id] && modelStatus[id].vision === false);
}

function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = () => {
            const scale = Math.min(1, IMAGE_MAX_SIDE / Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
            const ctx = c.getContext("2d");
            ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);   // flatten transparency
            ctx.drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            resolve(c.toDataURL("image/jpeg", 0.85));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
        img.src = url;
    });
}

async function addImageFiles(files) {
    if (!supportsImages(selectedModel)) { showToast("This model can't read images"); return; }
    for (const f of files) {
        if (!f.type.startsWith("image/")) continue;
        if (pendingImages.length >= MAX_IMAGES) { showToast("Up to " + MAX_IMAGES + " images per message"); break; }
        try { pendingImages.push(await fileToDataUrl(f)); } catch { showToast("Couldn't read that image"); }
    }
    renderAttachments(); updateComposer();
}

/* ===================================================================
   File attachments (any text file, Word .docx and PDF; not pictures)
   =================================================================== */
function supportsFiles(id) {
    const m = MODELS[id];
    return !!(m && m.files && isLoggedIn());
}

// Reads a file as base64 (the part after the data: prefix).
function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
        reader.onerror = () => reject(new Error("read failed"));
        reader.readAsDataURL(file);
    });
}

async function addDocumentFiles(files) {
    if (!supportsFiles(selectedModel)) { showToast("Log in to attach files"); return; }
    for (const f of files) {
        if (f.type.startsWith("image/")) { showToast("Use the image button for pictures"); continue; }
        if (pendingFiles.length >= MAX_FILES) { showToast("Up to " + MAX_FILES + " files per message"); break; }
        if (f.size > MAX_FILE_BYTES) { showToast(f.name + " is too large (max 8 MB)"); continue; }
        try { pendingFiles.push({ name: f.name, data: await readFileAsBase64(f) }); }
        catch { showToast("Couldn't read " + f.name); }
    }
    renderAttachments(); updateComposer();
}

function renderAttachments() {
    const strip = $("attachStrip");
    strip.innerHTML = "";
    strip.classList.toggle("hidden", pendingImages.length === 0 && pendingFiles.length === 0);
    pendingImages.forEach((url, i) => {
        const t = document.createElement("div"); t.className = "attach-thumb";
        const img = document.createElement("img"); img.src = url; img.alt = "Attached image";
        const x = document.createElement("button"); x.type = "button"; x.className = "attach-remove"; x.textContent = "×"; x.setAttribute("aria-label", "Remove image");
        x.addEventListener("click", () => { pendingImages.splice(i, 1); renderAttachments(); updateComposer(); });
        t.append(img, x); strip.appendChild(t);
    });
    pendingFiles.forEach((f, i) => {
        const chip = document.createElement("div"); chip.className = "file-chip";
        const nm = document.createElement("span"); nm.className = "file-chip-name"; nm.textContent = f.name; nm.title = f.name;
        const x = document.createElement("button"); x.type = "button"; x.className = "file-chip-remove"; x.textContent = "×"; x.setAttribute("aria-label", "Remove file");
        x.addEventListener("click", () => { pendingFiles.splice(i, 1); renderAttachments(); updateComposer(); });
        chip.append(nm, x); strip.appendChild(chip);
    });
}

/* ===================================================================
   Health polling
   =================================================================== */
async function pollHealth() {
    try {
        const r = await fetch(API_URL + "/health", { cache: "no-store" });
        if (!r.ok) throw new Error("health " + r.status);
        modelStatus = (await r.json()).models || {};
        await loadModels();
    } catch {

/* ===================================================================
   Conversations
   =================================================================== */
function loadLocalConversations() {
    try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); return Array.isArray(s) ? s : []; } catch { return []; }
}
function saveConversations() {
    if (isLoggedIn()) return;
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations, (k, v) => k === "images" ? undefined : v));
    } catch {}
}

function createConversation() {
    const now = Date.now();
    const c = { id: crypto.randomUUID(), remote: false, loaded: true, title: "New conversation", messages: [], createdAt: now, updatedAt: now };
    conversations.unshift(c);
    activeConversationId = c.id;
    localStorage.setItem(ACTIVE_KEY, c.id);
    saveConversations(); renderConversationList(); renderChat();
}
const getActiveConversation = () => conversations.find(c => c.id === activeConversationId) || null;
function ensureActiveConversation() { if (!getActiveConversation()) createConversation(); return getActiveConversation(); }

async function onAuthChanged() {
    const loggedIn = isLoggedIn();
    conversations = loggedIn ? [] : loadLocalConversations();
    activeConversationId = localStorage.getItem(ACTIVE_KEY);
    if (loggedIn) await syncConversations(true);
    if (!getActiveConversation()) {
        if (conversations.length) { activeConversationId = conversations[0].id; localStorage.setItem(ACTIVE_KEY, activeConversationId); }
        else createConversation();
    }
    updateAuthUI(); renderConversationList(); renderChat();
}

async function loadConversationMessages(conv) {
    const token = getToken();
    try {
        const r = await authFetch("/conversations/" + encodeURIComponent(conv.id), { cache: "no-store" });
        if (r.status === 401) { expireLogin(); return; }
        if (!r.ok || getToken() !== token) return;
        const d = await r.json();
        conv.messages = (d.messages || []).map(m => ({ role: m.role, content: m.role === "user" ? stripSyntaxPrefix(m.content) : m.content, timestamp: Math.round(m.ts * 1000), model: m.model || undefined }));
        conv.loaded = true;
    } catch {}
}

async function syncConversations(force) {
    if (!isLoggedIn() || syncing || (thinking && !force)) return;
    syncing = true;
    const token = getToken();
    try {
        const r = await authFetch("/conversations", { cache: "no-store" });
        if (r.status === 401) { expireLogin(); return; }
        if (!r.ok) return;
        const data = await r.json();
        if (getToken() !== token) return;
        const before = activeConversationId;
        const old = new Map(conversations.map(c => [c.id, c]));
        const merged = (data.conversations || []).map(sv => {
            const prev = old.get(sv.id);
            const localCount = prev ? prev.messages.filter(m => !m.transient).length : -1;
            const keep = !!(prev && prev.loaded !== false && localCount === sv.count);
            return { id: sv.id, title: sv.title, createdAt: sv.created * 1000, updatedAt: sv.updated * 1000, messages: keep ? prev.messages : [], loaded: keep, remote: true };
        });
        conversations.forEach(c => { if (!c.remote && c.messages.length === 0 && !merged.some(m => m.id === c.id)) merged.push(c); });
        conversations = merged;
        if (!getActiveConversation()) {
            if (conversations.length) { activeConversationId = conversations[0].id; localStorage.setItem(ACTIVE_KEY, activeConversationId); }
            else { createConversation(); return; }
        }
        let rerender = activeConversationId !== before;
        const active = getActiveConversation();
        if (active && active.remote && active.loaded === false) { await loadConversationMessages(active); rerender = true; }
        renderConversationList();
        if (rerender && !thinking) renderChat();
    } catch {} finally { syncing = false; }
}

const fmtTime = ts => new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(new Date(ts));
function fmtConvTime(ts) {
    const d = new Date(ts), n = new Date();
    const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    if (same(d, n)) return fmtTime(ts);
    const y = new Date(n); y.setDate(n.getDate() - 1);
    if (same(d, y)) return "Yesterday";
    return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(d);
}
function deriveTitle(t) { const c = t.replace(/\s+/g, " ").trim(); return !c ? "New conversation" : c.length <= 48 ? c : c.slice(0, 45).trimEnd() + "..."; }

        del.addEventListener("click", e => { e.stopPropagation(); deleteConversation(c.id); });

function deleteConversation(id) {
    const t = conversations.find(c => c.id === id);
    if (t && t.remote && isLoggedIn()) authFetch("/conversations/" + encodeURIComponent(id), { method: "DELETE" }).catch(() => {});
    conversations = conversations.filter(c => c.id !== id);
    saveConversations();
    if (activeConversationId === id) {
        activeConversationId = null; localStorage.removeItem(ACTIVE_KEY);
        if (conversations.length) {
            conversations.sort((a, b) => b.updatedAt - a.updatedAt);
            activeConversationId = conversations[0].id; localStorage.setItem(ACTIVE_KEY, activeConversationId);
        }
    }
    renderConversationList();
    if (activeConversationId && !thinking) openConversation(activeConversationId); else renderChat();
    showToast("Conversation deleted");
}

async function openConversation(id) {
    if (thinking) return;
    const c = conversations.find(x => x.id === id);
    if (!c) return;
    activeConversationId = id; localStorage.setItem(ACTIVE_KEY, id);
    setDrawer(false); renderConversationList();
    if (c.remote && c.loaded === false) {
        chatArea.innerHTML = '<div class="welcome"><p>Loading conversation…</p></div>';
        await loadConversationMessages(c);
    }
    if (activeConversationId === id) renderChat();
}

function addMessageElement(role, content, timestamp, model, isError, animate, images, fileNames) {

    const avatar = document.createElement("div");
    avatar.className = "avatar " + (role === "assistant" ? "aether" : "user");
    if (role === "assistant") { const img = document.createElement("img"); img.src = "./AetherIcon.png"; img.alt = ""; avatar.appendChild(img); }
    else avatar.textContent = "You";

    const body = document.createElement("div"); body.className = "message-body";
    const head = document.createElement("div"); head.className = "message-header";
    const name = document.createElement("span"); name.className = "message-name";

    const time = document.createElement("span"); time.className = "message-time"; time.textContent = fmtTime(timestamp);
    head.append(name, time);

    const text = document.createElement("div"); text.className = "message-content";

        for (const u of images) { const im = document.createElement("img"); im.src = u; im.alt = "Attached image"; box.appendChild(im); }
        body.appendChild(box);
    }
    if (fileNames && fileNames.length) {
        const box = document.createElement("div"); box.className = "msg-files";
        for (const n of fileNames) {
            const s = document.createElement("span");
            s.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-right:5px;opacity:.75"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
            s.append(document.createTextNode(n));
            s.title = n;
            box.appendChild(s);
        }
        body.appendChild(box);
    }
    body.append(text);

    if (role === "assistant" && !isError) {
        const actions = document.createElement("div"); actions.className = "message-actions";
        const copy = document.createElement("button"); copy.className = "copy-message"; copy.textContent = "Copy";
        copy.addEventListener("click", async () => {
            try { await navigator.clipboard.writeText(text.textContent); copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200); }
            catch { showToast("Couldn't copy message"); }
        });
        actions.appendChild(copy); body.appendChild(actions);
    }
    msg.append(avatar, body);
    return msg;
}

/* ===================================================================
   Live thinking indicator
   The server reports what the request is doing right now (stage). The
   site turns that into a line like "Aether Think is creating a file".
   =================================================================== */
let statusTimer = null;
function stopStatusPoll() { if (statusTimer) { clearInterval(statusTimer); statusTimer = null; } }

// Maps a server stage to the words shown after the model's name.
// Unknown or empty stages fall back to "is thinking".
function stagePhrase(stage, searching) {
    if (searching || stage === "searching web") return "is searching the web";
    if (stage === "reading docs") return "is reading docs";
    if (stage === "creating file") return "is creating a file";
    if (stage === "calculating") return "is calculating";
    if (stage === "running code") return "is running code";
    if (stage === "coding agent" || (stage || "").startsWith("agent step")) return "is working on your project";
    if (stage === "queued") return "is waiting for a free slot";
    return "is thinking";
}

// Writes the indicator text, with a short fade when the wording changes.
function setThinkingText(el, text) {
    if (el.textContent === text) return;
    el.textContent = text;
    el.classList.remove("swap");
    void el.offsetWidth;
    el.classList.add("swap");
}

// While the thinking indicator is showing, ask the server what this request is doing
// and update the wording as it changes.
function startStatusPoll(model) {
    stopStatusPoll();
    const convId = activeConversationId;
